# Profile: oss-full-enterprise — common-templates stage model (Kaniko/Helm consumers)
# security → static-security-upload → build → image → supply-chain → image-security-upload → deploy → post-deploy

stages:
  - validate
  - test
  - security
  - static-security-upload
  - build
  - image
  - supply-chain
  - image-security-upload
  - deploy
  - post-deploy

variables:
  REGISTRY: "${CI_REGISTRY_IMAGE}"
  SECURITY_POLICY: "config/security-gate-policy.yaml"
  ENABLE_REAL_LINTERS: "true"
  HELM_CHART_PATH: "chart"
  HELM_RELEASE: "sample-app"
  PREPROD_URL: "https://preprod.example.com"

include:
  - local: '/templates/gitlab/jobs/_security.common.yml'
  - local: '/templates/gitlab/jobs/oss/versions.yml'
  - local: '/templates/gitlab/jobs/oss/_docker.yml'
  - local: '/templates/gitlab/jobs/registry/variables.yml'
  - local: '/templates/gitlab/jobs/registry/login.yml'
  - local: '/templates/gitlab/jobs/oss/_base-validate.yml'
  - local: '/templates/gitlab/jobs/oss/gitleaks.yml'
  - local: '/templates/gitlab/jobs/forbidden-files.yml'
  - local: '/templates/gitlab/jobs/oss/semgrep-sast.yml'
  - local: '/templates/gitlab/jobs/oss/trivy-osa-sca.yml'
  - local: '/templates/gitlab/jobs/oss/checkov-iac.yml'
  - local: '/templates/gitlab/jobs/dockerfile-lint.yml'
  - local: '/templates/gitlab/jobs/linter-security.yml'
  - local: '/templates/gitlab/jobs/aspm/export-after-script.yml'
  - local: '/templates/gitlab/jobs/oss/build-push.yml'
  - local: '/templates/gitlab/jobs/sbom.yml'
  - local: '/templates/gitlab/jobs/oss/trivy-container.yml'
  - local: '/templates/gitlab/jobs/oss/helm-deploy-contour.yml'
  - local: '/templates/gitlab/jobs/dast.yml'
  - local: '/templates/gitlab/jobs/dast-compose.yml'
  - local: '/templates/gitlab/jobs/sign.yml'
  - local: '/templates/gitlab/jobs/conftest-admission.yml'

# Override stages for supply-chain jobs
sbom-generate:
  stage: supply-chain

trivy-container:
  stage: supply-chain

build-image:
  stage: image
