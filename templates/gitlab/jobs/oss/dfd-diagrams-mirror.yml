# Mirror service pipeline — DFD/THREAT diagrams + exports artifact bundle.

dfd-diagrams-report:
  stage: post-deploy
  image:
    name: $OSS_DIAGRAMS_IMAGE
    entrypoint: [""]
  needs:
    - job: dast-zap
      optional: false
    - job: api-fuzz-schemathesis
      optional: false
  variables:
    DFD_OUT_DIR: "reports/dfd/${SERVICE_NAME}"
  before_script:
    - !reference [.source_checkout, before_script]
  script:
    - |
      set -eu
      sh scripts/dfd-export-ci.sh
  artifacts:
    name: "dfd-bundle-${SERVICE_NAME}-${CI_PIPELINE_ID}"
    when: always
    paths:
      - reports/dfd/${SERVICE_NAME}/
    expire_in: 30 days
  rules:
    - if: '$SKIP_API_SECURITY == "true"'
      when: never
    - if: '$SKIP_DEPLOY == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /hotfix/i'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$SERVICE_NAME'
    - when: never
  allow_failure: false
