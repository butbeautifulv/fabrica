# Corp mirror — Schemathesis API fuzz after ephemeral deploy (Nexus image, no apt).
# Fails when no OpenAPI / API_BASE_URL / BUILD_FALLBACK / DEPLOY_SKIPPED (see run-schemathesis-mirror.sh).

api-fuzz-schemathesis:
  stage: api-security
  image:
    name: $OSS_SCHEMATHESIS_IMAGE
    entrypoint: [""]
  variables:
    SCHEMATHESIS_PHASES: "examples,coverage,fuzzing"
    ASPM_CONTROL: fuzzing
    ASPM_REPORT: reports/schemathesis-junit.xml
    # Do not set SCHEMATHESIS_HOOKS to a file path — Schemathesis imports it as a
    # module (hyphenated tests/security/schemathesis-hooks.py → ModuleNotFoundError
    # → no junit → gate warn fake-green). run-schemathesis-mirror.sh installs hooks.
  needs:
    - job: build-image
      artifacts: true
      optional: true
    - job: deploy-test
      artifacts: true
      optional: true
    - job: trivy-container
      optional: true
  before_script:
    - !reference [.source_checkout, before_script]
  script:
    - sh scripts/run-schemathesis-mirror.sh
  after_script:
    - |
      set -eu
      if [ -f reports/schemathesis-junit.xml ] && [ -s reports/schemathesis-junit.xml ]; then
        if command -v python3 >/dev/null 2>&1; then
          python3 scripts/aspm-export.py \
            --control fuzzing \
            --report reports/schemathesis-junit.xml \
            --config "${ASPM_CONFIG:-config/aspm-export.yaml}"
        else
          echo "[fuzz] ERROR: python3 missing — cannot ASPM upload"
          if [ "${DEFECTDOJO_FAIL_ON_ERROR:-false}" = "true" ]; then
            exit 1
          fi
        fi
      else
        echo "[fuzz] ASPM skip — no junit (fuzz may have failed earlier)"
      fi
  artifacts:
    when: always
    paths:
      - reports/schemathesis-junit.xml
    expire_in: 30 days
  allow_failure: false
