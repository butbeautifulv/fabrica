# Mirror service pipeline — ASPM HTML artifact (downloadable from GitLab job).

aspm-html-report:
  stage: post-deploy
  image:
    name: $OSS_PYTHON_IMAGE
    entrypoint: [""]
  needs:
    - job: dast-zap
      optional: false
    - job: api-fuzz-schemathesis
      optional: false
  variables:
    ASPM_HTML_OUT: "reports/aspm-report-${SERVICE_NAME}.html"
  before_script:
    - !reference [.source_checkout, before_script]
  script:
    - |
      set -eu
      if [ -z "${SERVICE_NAME:-}" ]; then
        echo "[aspm-html] ERROR: SERVICE_NAME is required"
        exit 1
      fi
      export PIP_NO_INPUT=1
      export PIP_DISABLE_PIP_VERSION_CHECK=1
      if [ -n "${PIP_INDEX_URL:-}" ] && [ -f scripts/pip-index-auth.sh ]; then
        export PIP_INDEX_URL="$(sh scripts/pip-index-auth.sh)"
      fi
      mkdir -p reports
      python3 scripts/dojo-render-aspm-report.py \
        --product "${SERVICE_NAME}" \
        --kev-catalog config/kev/cisa-kev.min.json \
        --epss-catalog config/epss/epss_scores.min.json.gz \
        --out "${ASPM_HTML_OUT}" \
        --write-slices
      test -s "${ASPM_HTML_OUT}" || { echo "[aspm-html] ERROR: empty report"; exit 1; }
      echo "[aspm-html] wrote ${ASPM_HTML_OUT}"
      echo "[aspm-html] artifacts:"
      ls -1 reports/aspm-report-"${SERVICE_NAME}"*.html reports/aspm-report-"${SERVICE_NAME}".slices.json 2>/dev/null || true
  artifacts:
    name: "aspm-html-${SERVICE_NAME}-${CI_PIPELINE_ID}"
    when: always
    paths:
      - reports/aspm-report-*.html
      - reports/aspm-report-*.slices.json
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /hotfix/i'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$SERVICE_NAME'
    - when: never
  allow_failure: false
