# Mirror CI service registry — resolve-mirror-service.sh parses without PyYAML.
#
# Triggers (prefer no hotfix git tags):
#   - API/web/trigger/schedule with CI vars SERVICE_NAME + SOURCE_REF
#     (fleet: make mirror-fleet-serial / scripts/mirror-fleet-trigger.py --wait)
#   - Schedule sync-sources: SHA-change pipelines only
#   - Release tags: <service_name>/vX.Y.Z  (hotfix* banned in workflow)
#
# Fields:
#   enabled: true|false — fleet/sync skip when false
#   tier: pilot|core|candidate|skip
#   scan_order: int — serial queue sort (lower first)
# Optional: openapi_path, api_base_url, deploy_*, readiness_path, service_port, notes
#
# Base image (subsidiary parity): registry…/map_objects/infra/python_prod_3.11
# Serial SOP: enable ONE candidate at a time; make mirror-fleet-serial SERVICE=…

